# Local development services. Usage: `pnpm db:up` (reads the root .env; see .env.example).
name: hotel-bambu

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-hotel_bambu}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # S3-compatible object storage. MinIO no longer publishes container images (ADR 0005),
  # so development uses RustFS, an Apache-2.0 S3-compatible server.
  storage:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-hotel-local-access}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-change-me-local-only-secret}
    ports:
      - '127.0.0.1:${S3_PORT:-9000}:9000'
      - '127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - storage-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot job: creates the media bucket and allows anonymous read of objects only
  # (image variants are public; listing and writes require credentials).
  storage-init:
    image: amazon/aws-cli:2.39.3
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-hotel-local-access}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-change-me-local-only-secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      BUCKET: ${S3_BUCKET:-hotel-media}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        S3="aws --endpoint-url http://storage:9000 s3api"
        $$S3 head-bucket --bucket "$$BUCKET" 2>/dev/null || $$S3 create-bucket --bucket "$$BUCKET"
        $$S3 put-bucket-policy --bucket "$$BUCKET" --policy "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::$$BUCKET/*\"]}]}"
        echo "Bucket $$BUCKET ready"
    restart: 'no'

  # Next.js dev server in Linux (profile `web`, opt-in: `docker compose --profile web up web`).
  # Needed on hosts where native binaries cannot run (e.g. Windows Application Control blocks
  # Tailwind's oxide binary). The repo is bind-mounted; node_modules and .next live in named
  # volumes so Linux binaries are installed inside the container. The API keeps running on the
  # host (`pnpm --filter @hotel-bambu/api dev`) and is reached via host.docker.internal.
  web:
    profiles: ['web']
    image: node:24-bookworm-slim
    working_dir: /repo
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      CI: 'true' # non-interactive pnpm install
      NEXT_TELEMETRY_DISABLED: '1'
      WATCHPACK_POLLING: 'true' # bind mounts from Windows/macOS do not deliver inotify events
      API_INTERNAL_URL: ${WEB_API_INTERNAL_URL:-http://host.docker.internal:4000}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      WEB_COMMAND: ${WEB_COMMAND:-dev}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command:
      - /bin/sh
      - -c
      - |
        set -e
        corepack enable
        pnpm install --frozen-lockfile --filter @hotel-bambu/web... --filter hotel-bambu-platform
        pnpm --filter @hotel-bambu/shared build
        if [ "$$WEB_COMMAND" = "build" ]; then
          pnpm --filter @hotel-bambu/web build
        else
          pnpm --filter @hotel-bambu/web exec next dev --hostname 0.0.0.0 --port 3000
        fi
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    volumes:
      - .:/repo
      - web-root-modules:/repo/node_modules
      - web-app-modules:/repo/apps/web/node_modules
      - web-shared-modules:/repo/packages/shared/node_modules
      - web-next:/repo/apps/web/.next
      - web-pnpm-store:/root/.local/share/pnpm

volumes:
  postgres-data:
  storage-data:
  web-root-modules:
  web-app-modules:
  web-shared-modules:
  web-next:
  web-pnpm-store:
