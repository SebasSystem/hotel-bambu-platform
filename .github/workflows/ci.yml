name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: hotel
          POSTGRES_PASSWORD: hotel-ci
          POSTGRES_DB: hotel_bambu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotel -d hotel_bambu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://hotel:hotel-ci@localhost:5432/hotel_bambu?schema=public
      API_INTERNAL_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # End-to-end + axe (requirement 23) against a production build: Postgres and S3 storage from
  # docker compose, API and web on the runner, Playwright in its official image (host network).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://hotel:change-me-local-only@localhost:5432/hotel_bambu?schema=public
      S3_ACCESS_KEY: hotel-local-access
      S3_SECRET_KEY: change-me-local-only-secret
      S3_PUBLIC_URL: http://localhost:9000/hotel-media
      SESSION_SECRET: ci-only-session-secret-0123456789abcdefghijkl
      REVALIDATE_SECRET: ci-only-revalidate-secret-0123456789abcdef
      WEB_INTERNAL_URL: http://localhost:3000
      WEB_ORIGINS: http://localhost:3000
      COOKIE_SECURE: 'false'
      API_INTERNAL_URL: http://localhost:4000
      SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: Bambu-ci-only-2026!
      E2E_ADMIN_EMAIL: admin@example.test
      E2E_ADMIN_PASSWORD: Bambu-ci-only-2026!
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Start Postgres and storage
        run: |
          docker compose up -d --wait postgres storage
          docker compose run --rm storage-init
      - name: Build
        run: pnpm build
      - name: Migrate, seed and create the admin
        run: |
          pnpm --filter @hotel-bambu/api db:migrate:deploy
          pnpm --filter @hotel-bambu/api db:seed:base
          APP_ENV=ci NODE_ENV=development pnpm --filter @hotel-bambu/api db:seed:demo
          pnpm --filter @hotel-bambu/api admin:create
      - name: Start API and web
        run: |
          nohup pnpm --filter @hotel-bambu/api start > api.log 2>&1 &
          nohup pnpm --filter @hotel-bambu/web start > web.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/api/v1/health > /dev/null && curl -fsS -o /dev/null http://localhost:3000/ && exit 0
            sleep 2
          done
          cat api.log web.log; exit 1
      - name: Playwright (official image)
        run: pnpm e2e
      - name: Lighthouse CI (budgets, non-blocking)
        if: always()
        continue-on-error: true
        run: pnpm lighthouse
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: |
            e2e/test-results
            api.log
            web.log
          retention-days: 7

  # Production images (deploy/README.md): build only, never pushed. Catches Dockerfile, standalone
  # output and compose breakage. The template env file is enough for interpolation.
  docker-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Validate production compose file
        run: docker compose -f docker-compose.prod.yml --env-file deploy/env.production.example config --quiet
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: hotel-bambu-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: API_INTERNAL_URL=http://api:4000
          push: false
          tags: hotel-bambu-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build backup image
        uses: docker/build-push-action@v7
        with:
          context: deploy/backup
          push: false
          tags: hotel-bambu-backup:ci
